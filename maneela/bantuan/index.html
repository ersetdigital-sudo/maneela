<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bantuan · Maneela</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/theme.css">
</head><body>
<main class="wrap pt-6 sm:pt-10">
  <div class="max-w-2xl">
    <h1 class="font-black text-4xl sm:text-6xl leading-[1.02]">Ada yang bikin bingung?</h1>
    <div class="relative mt-6"><span id="si" class="absolute left-4 top-1/2 -translate-y-1/2 c-mut"></span><input id="q" class="input !pl-12" placeholder="Ketik aja, misal: refund"></div>
    <div id="cats" class="hscroll mt-4"></div>
  </div>
  <div class="grid lg:grid-cols-[1.5fr_1fr] gap-6 mt-8 items-start">
    <div id="list" class="space-y-3"></div>
    <aside id="kontak" class="card shadow-off p-6 lg:sticky lg:top-[88px] scroll-mt-24">
      <h2 class="font-extrabold text-2xl">Masih butuh teman ngobrol?</h2>
      <p class="c-mut mt-2 text-sm">CS kami standby tiap hari, 08.00–22.00 WIB. Siapkan kode invoice biar cepat beres.</p>
      <div class="space-y-2.5 mt-5">
        <a href="#" class="flex items-center gap-3 rounded-2xl p-3 bg-[#FEFFF1] hover:bg-[#FFDB59] transition"><span class="w-10 h-10 rounded-xl grid place-items-center" style="background:var(--red);color:var(--bg)" data-i="chat"></span><span><b class="block">WhatsApp</b><span class="text-sm c-mut">Nomor resmi segera hadir</span></span></a>
        <a href="#" class="flex items-center gap-3 rounded-2xl p-3 bg-[#FEFFF1] hover:bg-[#FFDB59] transition"><span class="w-10 h-10 rounded-xl grid place-items-center" style="background:var(--red);color:var(--bg)" data-i="mail"></span><span><b class="block">Email</b><span class="text-sm c-mut">Email resmi segera hadir</span></span></a>
        <a href="/invoice" class="flex items-center gap-3 rounded-2xl p-3 bg-[#FEFFF1] hover:bg-[#FFDB59] transition"><span class="w-10 h-10 rounded-xl grid place-items-center" style="background:var(--red);color:var(--bg)" data-i="receipt"></span><span><b class="block">Cek invoice</b><span class="text-sm c-mut">Lihat status pesananmu</span></span></a>
      </div>
    </aside>
  </div>
</main>
<script src="/assets/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const {ico}=CZ;document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ico(e.dataset.i));document.getElementById('si').innerHTML=ico('search');
const F=[
['Pembayaran','Bisa bayar pakai apa aja?','Banyak pilihan: QRIS, VA BCA/BRI/Mandiri (+Rp4.000), DANA dan OVO (gratis), atau langsung di kasir Alfamart/Indomaret (+Rp2.500).'],
['Pembayaran','Udah bayar, kok statusnya belum berubah?','Santai dulu, konfirmasi biasanya butuh 1–3 menit. Kalau lewat 15 menit masih sama, kirim kode invoice ke CS kami ya.'],
['Pembayaran','Ada biaya tersembunyi nggak?','Nggak ada. Biaya cuma dari metode bayar dan admin produk tertentu (misal PLN atau e-wallet), dan semuanya kelihatan di ringkasan sebelum kamu bayar.'],
['Pesanan','Secepat apa pesananku masuk?','Biasanya ±5 detik setelah pembayaran terkonfirmasi. Beres sekejap.'],
['Pesanan','Salah ketik nomor tujuan, bisa dibatalin?','Sayangnya transaksi yang sudah sukses nggak bisa ditarik lagi. Makanya, cek ulang nomor di ringkasan sebelum tekan bayar.'],
['Pesanan','Transaksi gagal, uangku aman?','Aman. Dana balik otomatis ke metode bayar yang kamu pakai, paling lama 1x24 jam.'],
['Pesanan','Token PLN-ku muncul di mana?','Kode token tampil di halaman invoice, dan dikirim ke email kalau kamu mengisinya.'],
['Akun','Harus bikin akun dulu?','Nggak usah. Isi tujuan, bayar, beres. Simpan kode invoice biar gampang cek status nanti.'],
['Akun','Riwayat transaksiku kok hilang?','Riwayat disimpan di browser kamu. Ganti HP atau hapus data browser bikin riwayatnya nggak kebawa, tapi tetap bisa dicari pakai kode invoice.'],
['Promo','Cara pakai kode promo gimana?','Ketik kodenya di halaman pembayaran, tekan "Pakai", dan potongannya langsung kelihatan di total.'],
['Promo','MANEELA5 dapet apa aja?','Diskon 5% untuk semua layanan, maksimal hemat Rp5.000 per transaksi.']];
const cats=['Semua','Pembayaran','Pesanan','Akun','Promo'];let c='Semua';
const q=document.getElementById('q'),L=document.getElementById('list'),C=document.getElementById('cats');
function render(){C.innerHTML=cats.map(k=>`<button class="prov !pl-4 ${c===k?'on':''}" data-c="${k}">${k}</button>`).join('');
 C.querySelectorAll('button').forEach(b=>b.onclick=()=>{c=b.dataset.c;render()});
 const s=q.value.toLowerCase().trim();const r=F.filter(([k,a,b])=>(c==='Semua'||k===c)&&(!s||(a+b).toLowerCase().includes(s)));
 L.innerHTML=r.length?r.map(([k,a,b])=>`<details class="faq"><summary><span><span class="badge !text-[11px] !py-0.5 mb-2">${k}</span><span class="block">${a}</span></span><span class="pl">${ico('plus')}</span></summary><p>${b}</p></details>`).join(''):`<div class="card p-6 c-mut">Belum ada jawaban buat "<b>${q.value}</b>". Coba kata lain atau hubungi CS.</div>`;}
q.addEventListener('input',render);render();
});
</script>
</body></html>
